<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pet Health">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Pet Health Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="application-name" content="Pet Health Tracker">
<meta name="description" content="Track pet health, daily care, weight, medications, meals, symptoms, mood and vet visits.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!-- Bump ?v= on both files with every release, so browsers fetch the new ones together. -->
<link rel="stylesheet" href="styles.css?v=6.1">
<script>
  // Apply this device's saved color theme before the page draws, so the
  // default colors don't flash first.
  try {
    var savedTheme = localStorage.getItem('petHealth.theme');
    if (savedTheme && savedTheme !== 'garden') document.documentElement.setAttribute('data-theme', savedTheme);
  } catch (e) {}
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="app">
  <div class="update-banner" id="updateBanner" role="alert" hidden>
    <span id="updateBannerText"></span>
    <button type="button" class="sage tiny" onclick="location.reload()">Reload</button>
  </div>
  <header class="header">
    <div class="brand">
      <div class="logo" aria-hidden="true">🐾</div>
      <h1>Pet Health Tracker</h1>
    </div>
    <div class="header-actions">
      <button id="authBtn" class="secondary" type="button">☁ Cloud sync</button>
      <span class="header-sep" aria-hidden="true"></span>
      <button id="importBtn" class="ghost" type="button">Import</button>
      <button id="exportCsvBtn" class="ghost" type="button">Export CSV</button>
      <button id="exportJsonBtn" class="ghost" type="button">Export JSON</button>
      <button id="themeBtn" class="ghost" type="button" title="Color theme" aria-label="Color theme">🎨</button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar card">
      <p class="side-title">Your pets</p>
      <div class="pet-list" id="petList" role="list"></div>
    </aside>

    <main class="main">
      <!-- Pet summary panel (mobile tab: Home) -->
      <section class="panel active" id="panel-home" data-panel="home">
        <section class="summary card">
          <div>
            <div class="pet-hero">
              <div class="hero-icon" id="heroIcon">🐾</div>
              <div style="min-width:0">
                <div class="hero-name" id="heroName">No pet selected</div>
                <div class="hero-meta" id="heroMeta">Add a pet to begin tracking.</div>
              </div>
            </div>
            <div class="stats">
              <div class="stat"><b id="sWeight">—</b><span>Weight</span></div>
              <div class="stat"><b id="sWeightChange">—</b><span>Weight · 30 days</span></div>
              <div class="stat"><b id="sMood">—</b><span>Mood · 30 days</span></div>
              <div class="stat"><b id="sVet">—</b><span>Last vet visit</span></div>
            </div>
          </div>
          <div class="care-note">
            <b>Last 14 days</b>
            <ul id="careNotes"><li>No logs yet.</li></ul>
          </div>
        </section>

        <!-- Daily routine checklist -->
        <section class="today card" id="todayCard" hidden>
          <div class="section-h">
            <h2 id="todayTitle">Today</h2>
            <span class="hint">Daily routine</span>
          </div>
          <div id="todayList"></div>
        </section>
      </section>

      <!-- Workspace: form + chart + records -->
      <section class="panel active" id="panel-log" data-panel="log">
        <div class="workspace">
          <section class="record-form card">
            <div class="section-h">
              <h2 id="formTitle">Add a log</h2>
              <span class="hint" id="formHint">All fields optional</span>
            </div>
            <form id="recordForm" autocomplete="off">
              <input type="hidden" id="rId" value="">
              <label class="field">Date<input type="date" id="rDate" required></label>
              <div class="tag-chips" id="rTags" role="group" aria-label="Event tags">
                <span class="tag-routine-item"><button type="button" class="tag-chip symptom" data-tag="symptom" aria-pressed="false">Symptom</button><button type="button" class="star tag-routine-star" data-routine-tag="symptom" title="Put Symptom in Daily Routine" aria-label="Put Symptom in Daily Routine" aria-pressed="false">☆</button></span>
                <span class="tag-routine-item"><button type="button" class="tag-chip vomit" data-tag="vomit" aria-pressed="false">Vomit</button><button type="button" class="star tag-routine-star" data-routine-tag="vomit" title="Put Vomit in Daily Routine" aria-label="Put Vomit in Daily Routine" aria-pressed="false">☆</button></span>
                <span class="tag-routine-item"><button type="button" class="tag-chip stool" data-tag="stool" aria-pressed="false">Stool</button><button type="button" class="star tag-routine-star" data-routine-tag="stool" title="Put Stool in Daily Routine" aria-label="Put Stool in Daily Routine" aria-pressed="false">☆</button></span>
                <span class="tag-routine-item"><button type="button" class="tag-chip activity" data-tag="activity" aria-pressed="false">Activity</button><button type="button" class="star tag-routine-star" data-routine-tag="activity" title="Put Activity in Daily Routine" aria-label="Put Activity in Daily Routine" aria-pressed="false">☆</button></span>
                <span class="tag-routine-item"><button type="button" class="tag-chip vet" data-tag="vet" aria-pressed="false">Vet visit</button><button type="button" class="star tag-routine-star" data-routine-tag="vet" title="Put Vet visit in Daily Routine" aria-label="Put Vet visit in Daily Routine" aria-pressed="false">☆</button></span>
              </div>
              <!-- Quick labels and play size, shown when Symptom or Activity is chosen -->
              <div class="label-panel" id="labelPanel"></div>
              <div class="form-grid type-fields">
                <label class="field"><span class="field-head">Weight <button type="button" class="star" id="starWeight" title="Weigh in every day" aria-label="Weigh in every day" aria-pressed="false">☆</button>
                  <select id="weightUnit" class="unit-select" aria-label="Weight unit"><option value="lboz">lb &amp; oz</option><option value="lb">lb</option><option value="kg">kg</option></select></span>
                  <span class="weight-inputs"><input type="number" step="any" min="0" id="rWeight" inputmode="decimal" placeholder="lb">
                  <input type="number" step="any" min="0" id="rWeightOz" inputmode="decimal" placeholder="oz" aria-label="Ounces"></span></label>
                <label class="field"><span class="field-head">Mood <button type="button" class="star" id="starMood" title="Log mood every day" aria-label="Log mood every day" aria-pressed="false">☆</button></span><input type="number" min="1" max="5" id="rMood" inputmode="numeric" placeholder="1–5"></label>
                <label class="field">Activity<input type="number" id="rActivity" inputmode="numeric" placeholder="min"></label>
                <label class="field">Cost<input type="number" step="0.01" id="rCost" inputmode="decimal" placeholder="$"></label>
              </div>
              <div class="food-section">
                <div class="food-head">
                  <span class="small-label" style="margin:0">Food <button type="button" class="star" id="starFood" title="Put food in Daily Routine" aria-label="Put food in Daily Routine" aria-pressed="false">☆</button></span>
                  <span class="food-head-actions"><button type="button" class="ghost tiny" id="addFoodRow">＋ Food</button><button type="button" class="ghost tiny" id="manageFoodsBtn">⚙ Foods</button></span>
                </div>
                <div class="food-rows" id="foodRows"></div>
                <div class="food-quick" id="foodQuick" hidden></div>
              </div>
              <div class="med-section">
                <div class="med-head"><span class="small-label" style="margin:0">Medicines</span><button type="button" class="ghost tiny" id="addMedRow">＋ Medicine</button></div>
                <div class="med-rows" id="medRows"></div>
              </div>
              <div class="med-section measure-section">
                <div class="med-head"><span class="small-label" style="margin:0">Measurements</span>
                  <span class="measure-tools"><label class="measure-time">Time <input type="time" id="rTime" aria-label="Time of the readings"></label>
                  <button type="button" class="ghost tiny" id="addMeasureBtn">＋ Measure</button></span></div>
                <div id="measureRows"></div>
              </div>
              <label class="field">Note<textarea id="rNote" placeholder="Symptoms, appetite, behavior, vet instructions…"></textarea></label>
              <datalist id="medOptions"></datalist>
              <datalist id="foodOptions"></datalist>
              <p class="append-hint" id="appendHint"></p>
              <div class="form-actions">
                <button type="submit" class="sage" id="submitBtn">Add log</button>
                <button type="button" id="appendBtn" class="secondary">Add to last log</button>
                <button type="button" id="clearForm" class="ghost">Clear</button>
              </div>
            </form>
          </section>

          <div class="content">
            <section class="chart-card card" id="trends-card">
              <div class="section-h">
                <h2>Trends</h2>
                <div class="chart-controls">
                <select id="chartRange" aria-label="Time range" style="width: auto; min-height: 36px; padding: 6px 12px;">
                  <option value="30">30 days</option>
                  <option value="90" selected>90 days</option>
                  <option value="365">1 year</option>
                  <option value="all">All time</option>
                </select>
                <select id="chartMode" aria-label="Chart" style="width: auto; min-height: 36px; padding: 6px 12px;">
                  <optgroup label="Daily">
                    <option value="weight">Weight</option>
                    <option value="food">Food intake</option>
                    <option value="mood">Mood</option>
                    <option value="activity">Activity minutes</option>
                    <option value="cost">Cost</option>
                  </optgroup>
                  <optgroup label="Per week">
                    <option value="gi-weekly">Vomit &amp; diarrhea</option>
                    <option value="vomit-weekly">Vomit</option>
                    <option value="diarrhea-weekly">Diarrhea</option>
                    <option value="stool-weekly">Stool</option>
                    <option value="symptom-weekly">Symptoms</option>
                    <option value="play-weekly">Play</option>
                  </optgroup>
                </select>
                <select id="foodChartUnit" aria-label="Food chart unit" hidden style="width: auto; min-height: 36px; padding: 6px 12px;">
                  <option value="kcal">Calories (kcal)</option>
                  <option value="can">Cans</option><option value="pouch">Pouches</option><option value="g">Grams</option><option value="oz">Ounces</option><option value="kg">Kilograms</option><option value="lb">Pounds</option><option value="cup">Cups</option><option value="serving">Servings</option><option value="piece">Pieces</option>
                </select>
                </div>
              </div>
              <div class="chart-summary" id="chartSummary"></div>
              <div class="chart-wrap"><canvas id="chart"></canvas></div>
            </section>

            <section class="records-card card">
              <div class="section-h">
                <h2>Recent logs</h2>
                <div class="records-tools">
                  <input id="search" placeholder="Search…" aria-label="Search logs">
                </div>
              </div>
              <div class="records-list" id="records"></div>
            </section>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- Mobile bottom tabs -->
<nav class="mobile-nav" aria-label="Sections">
  <button data-tab="home" class="active" type="button"><span class="nav-icon">🏠</span><span>Home</span></button>
  <button data-tab="add" type="button"><span class="nav-icon">＋</span><span>Add log</span></button>
  <button data-tab="trends" type="button"><span class="nav-icon">📈</span><span>Trends</span></button>
  <button data-tab="logs" type="button"><span class="nav-icon">📋</span><span>Logs</span></button>
</nav>

<!-- Mobile floating menu (export/import) -->
<button class="mobile-fab" id="mobileFab" type="button" aria-label="More options">⋯</button>

<!-- Modal -->
<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <h2 id="modalTitle">—</h2>
      <button class="modal-close" id="modalClose" type="button" aria-label="Close">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Hidden file input for JSON import -->
<input type="file" id="fileInput" accept="application/json,.json" class="sr-only" aria-hidden="true">
<input type="file" id="csvInput" accept=".csv,text/csv" class="sr-only" aria-hidden="true">

<!-- Vet summary: shown over the app, and the only thing printed -->
<div class="vet-report" id="vetReport" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js?v=6.1"></script>
<script>
  // PWA shell: GitHub Pages is HTTPS, so the service worker can make this
  // site installable and keep the local app shell available when offline.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {
        // Installation support is optional; never block the health tracker if
        // a browser or private mode refuses service-worker registration.
      });
    });
  }
</script>
</body>
</html>
